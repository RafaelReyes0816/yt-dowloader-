name: Diagnostico Cookies

on:
  workflow_dispatch:

jobs:
  diagnostico:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artefacto: diagnostico_cookies-windows
            binario: dist/diagnostico_cookies.exe
          - os: macos-latest
            artefacto: diagnostico_cookies-macos
            binario: dist/diagnostico_cookies
          - os: ubuntu-latest
            artefacto: diagnostico_cookies-linux
            binario: dist/diagnostico_cookies
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build diagnostico
        run: pyinstaller --onefile --name diagnostico_cookies --hidden-import curl_cffi --hidden-import curl_cffi.requests core_tests/diagnostico_cookies.py

      - name: Upload diagnostico
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: ${{ matrix.binario }}

      - name: Run diagnostico (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./${{ matrix.binario }} || true
