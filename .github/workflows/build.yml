name: Build Executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: yt-dowloader-linux
            asset_name: yt-dowloader-linux.tar.gz
          - os: windows-latest
            artifact_name: yt-dowloader-windows
            asset_name: yt-dowloader-windows.zip
          - os: macos-13
            artifact_name: yt-dowloader-macos-intel
            asset_name: yt-dowloader-macos-intel.zip
          - os: macos-latest
            artifact_name: yt-dowloader-macos-arm
            asset_name: yt-dowloader-macos-arm.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: pip install pyinstaller yt-dlp ttkbootstrap

      - name: Build executable
        run: pyinstaller yt-dowloader.spec

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            dist/yt-dowloader.exe --help 2>&1 || true
          else
            chmod +x dist/yt-dowloader
            dist/yt-dowloader --help 2>&1 || true
          fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset_name }} -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.asset_name }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: zip -r ${{ matrix.asset_name }} -j dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
