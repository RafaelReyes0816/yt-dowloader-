name: Build Executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: yt-dowloader-linux
            asset_name: yt-dowloader-linux.tar.gz
          - os: windows-latest
            artifact_name: yt-dowloader-windows
            asset_name: yt-dowloader-windows.zip
          - os: macos-latest
            artifact_name: yt-dowloader-macos
            asset_name: yt-dowloader-macos.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Download ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-temp
          $zipDir = Get-ChildItem -Path ffmpeg-temp -Directory | Select-Object -First 1
          Copy-Item "$($zipDir.FullName)/bin/ffmpeg.exe" -Destination dist/
          Copy-Item "$($zipDir.FullName)/bin/ffprobe.exe" -Destination dist/
          Remove-Item ffmpeg.zip
          Remove-Item ffmpeg-temp -Recurse -Force

      - name: Install Python dependencies
        run: pip install pyinstaller yt-dlp customtkinter

      - name: Build executable
        run: pyinstaller yt-dowloader.spec

      - name: Verify executable exists
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ls -lh dist/yt-dowloader.exe
            ls -lh dist/ffmpeg.exe
          else
            ls -lh dist/yt-dowloader
          fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset_name }} -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.asset_name }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: zip -r ${{ matrix.asset_name }} -j dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
